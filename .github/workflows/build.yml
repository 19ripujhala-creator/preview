name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Unsigned iOS IPA (AltStore / Sideloadly)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Get Flutter Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (No Codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=RAJSHALA_DDDDOCR_VERSION=1.5.6

      - name: Package Runner.app into Shaladarpan.ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 Shaladarpan.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shaladarpan-iOS-Release
          path: build/ios/iphoneos/Shaladarpan.ipa
          retention-days: 14
