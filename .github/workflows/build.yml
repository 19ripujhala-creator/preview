name: Build iOS IPA

on:
  workflow_dispatch: # GitHub website se 'Run workflow' button dabane ke liye
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Prepare iOS & CocoaPods
        run: |
          # Agar ios directory me Podfile missing hai toh Flutter se config generate karwayega
          flutter create . --platforms=ios
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (Release without codesign)
        run: flutter build ios --release --no-codesign

      - name: Package App into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 Shaladarpan.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shaladarpan-iOS
          path: build/ios/iphoneos/Shaladarpan.ipa
          retention-days: 7