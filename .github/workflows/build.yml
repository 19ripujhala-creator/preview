name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Unsigned iOS IPA (AltStore / Sideloadly)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Get Flutter Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Run regression tests
        run: flutter test --no-pub test/direct test/experiments

      - name: Check Dart analyzer errors
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # Prepares Flutter's generated Xcode config (Generated.xcconfig, Flutter frameworks, etc.)
      # without invoking Flutter's own signing precheck, which fails even with --no-codesign.
      - name: Prepare Flutter build assets
        run: |
          flutter build ios --release --no-codesign --config-only \
            --dart-define=RAJSHALA_DDDDOCR_VERSION=1.5.6

      # Disable Automatic Code Signing so Xcode doesn't demand an Apple ID Team
      - name: Disable Automatic Code Signing in Xcode
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "[^"]*";/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          cd ..

      # Build directly with xcodebuild, overriding signing settings on the command line.
      # These overrides take precedence over the pbxproj, which is why this succeeds
      # where `flutter build ios --no-codesign` fails on its own precheck.
      - name: Build iOS Release (No Codesign) via xcodebuild
        run: |
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios/archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
          cd ..

      - name: Package Runner.app into Shaladarpan.ipa
        run: |
          APP_PATH=$(find build/ios/archive -name "Runner.app" -maxdepth 6 -print -quit)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ios/iphoneos
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -9 build/ios/iphoneos/Shaladarpan.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shaladarpan-iOS-Release
          path: build/ios/iphoneos/Shaladarpan.ipa
          retention-days: 14