name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'any'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Create Podfile if missing and Install CocoaPods
      run: |
        cd ios
        if [ ! -f "Podfile" ]; then
          pod init
        fi
        pod install

    - name: Build iOS App (Release without codesigning)
      run: flutter build ios --release --no-codesign