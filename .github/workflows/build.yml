name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Setup iOS Platform & Podfile
        run: |
          # Agar ios folder ya Podfile nahi hai, toh flutter create se generate karein
          if [ ! -d "ios" ] || [ ! -f "ios/Podfile" ]; then
            flutter create . --platforms=ios
          fi
          
          # Safety check: agar fir bhi Podfile missing ho toh pod init chala dein
          cd ios
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          pod install
          cd ..

      - name: Build iOS App (Release without codesign)
        run: flutter build ios --release --no-codesign

      - name: Package App into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 Shaladarpan.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shaladarpan-iOS
          path: build/ios/iphoneos/Shaladarpan.ipa
          retention-days: 7