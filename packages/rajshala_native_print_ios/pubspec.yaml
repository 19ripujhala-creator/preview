name: rajshala_native_print_ios
description: iOS implementation of Rajshala's existing authenticated portal print channel.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: RajshalaNativePrintPlugin
